document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

),0 1px 1px rgba(14,17,22,0.03);padding:18px;display:flex;flex-direction:column\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <div style=\"width:38px;height:38px;border-radius:11px;background:#FFF1EA;display:grid;place-items:center;color:#D5561D;flex-shrink:0\">\n                  <sc-if value=\"{{a.isCampaign}}\" hint-placeholder-val=\"{{false}}\">\n                    <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m22 2-7 20-4-9-9-4Z\"><\u002Fpath><path d=\"M22 2 11 13\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{a.isLetter}}\" hint-placeholder-val=\"{{false}}\">\n                    <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"M16 13H8\"><\u002Fpath><path d=\"M16 17H8\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{a.isFollowup}}\" hint-placeholder-val=\"{{false}}\">\n                    <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <p style=\"font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#C24E15;margin:0\">{{a.kicker}}<\u002Fp>\n              <\u002Fdiv>\n              <h3 style=\"font-size:15px;font-weight:700;color:#0D1319;margin:12px 0 0;line-height:1.35;font-feature-settings:'tnum' 1\">{{a.title}}<\u002Fh3>\n              <p style=\"font-size:12.5px;color:#475569;line-height:1.55;margin:6px 0 0;flex:1;font-feature-settings:'tnum' 1;text-wrap:pretty\">{{a.body}}<\u002Fp>\n              <button sc-camel-on-click=\"{{a.onClick}}\" style=\"margin-top:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;border-radius:9px;border:1px solid #E3E7EE;background:#FFFFFF;color:#0D1319;font-size:12.5px;font-weight:600;cursor:pointer;transition:background 0.15s\" style-hover=\"background:#EFF2F6\">\n                {{a.cta}}\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;showSidebar&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Layout&quot; },\n  &quot;underservedCutoff&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0.8, &quot;min&quot;: 0.5, &quot;max&quot;: 0.95, &quot;step&quot;: 0.05, &quot;unit&quot;: &quot;\\u00d7&quot;, &quot;section&quot;: &quot;Scoring&quot;, &quot;tsType&quot;: &quot;number&quot; },\n  &quot;overservedCutoff&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1.25, &quot;min&quot;: 1.05, &quot;max&quot;: 1.8, &quot;step&quot;: 0.05, &quot;unit&quot;: &quot;\\u00d7&quot;, &quot;section&quot;: &quot;Scoring&quot;, &quot;tsType&quot;: &quot;number&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { period: 2, dim: \"suburb\", sel: null, rowDim: \"suburb\", colDim: \"age\" };\n  trackRef = React.createRef();\n\n  PERIODS = [\n    { label: \"Last week\", short: \"1w\", kicker: \"LAST 7 DAYS\", base: 0.045 },\n    { label: \"Last month\", short: \"1m\", kicker: \"LAST 30 DAYS\", base: 0.13 },\n    { label: \"Last 3 months\", short: \"3m\", kicker: \"LAST 3 MONTHS\", base: 0.29 },\n    { label: \"Last 6 months\", short: \"6m\", kicker: \"LAST 6 MONTHS\", base: 0.46 },\n    { label: \"Last year\", short: \"1y\", kicker: \"LAST 12 MONTHS\", base: 0.63 },\n  ];\n\n  TOTAL = 120400;\n\n  DIMS = {\n    suburb: { label: \"Suburb\", segs: [\n      [\"Parramatta\", 18900, 1.05, 1.0, 0.85],\n      [\"Carlingford\", 13800, 1.55, 1.15, 0.55],\n      [\"Epping\", 12600, 1.45, 1.2, 0.6],\n      [\"Granville\", 11400, 0.55, 0.75, 0.7],\n      [\"Toongabbie\", 10900, 0.9, 0.95, 0.65],\n      [\"Westmead\", 9800, 1.0, 1.05, 0.8],\n      [\"Wentworthville\", 9600, 0.85, 0.9, 0.65],\n      [\"North Parramatta\", 8700, 1.1, 1.0, 0.7],\n      [\"Dundas Valley\", 7300, 1.2, 1.05, 0.5],\n      [\"Harris Park\", 6200, 0.38, 0.7, 0.9],\n      [\"Rydalmere\", 6100, 0.95, 0.9, 0.6],\n      [\"Telopea\", 5100, 0.65, 0.8, 0.55],\n    ]},\n    age: { label: \"Age\", segs: [\n      [\"30\\u201344\", 38600, 1.0, 1.0, 0.85],\n      [\"45\\u201359\", 28900, 1.2, 1.1, 0.7],\n      [\"18\\u201329\", 24100, 0.45, 0.7, 0.95],\n      [\"60\\u201374\", 19700, 1.5, 1.25, 0.45],\n      [\"75+\", 9100, 1.35, 1.15, 0.15],\n    ]},\n    ethnicity: { label: \"Ethnicity\", segs: [\n      [\"Anglo-Australian\", 32800, 1.4, 1.1, 0.6],\n      [\"Indian\", 26400, 0.7, 1.0, 0.9],\n      [\"No community tag\", 23700, 0.5, 0.7, 0.7],\n      [\"Chinese\", 18200, 0.85, 0.95, 0.75],\n      [\"Lebanese\", 8900, 0.75, 0.9, 0.7],\n      [\"Korean\", 5600, 0.5, 0.85, 0.8],\n      [\"Filipino\", 4800, 0.9, 1.05, 0.8],\n    ]},\n    religion: { label: \"Religion\", segs: [\n      [\"No religion\", 28200, 1.1, 1.0, 0.85],\n      [\"Catholic\", 24600, 1.25, 1.1, 0.6],\n      [\"Hindu\", 21300, 0.75, 1.0, 0.9],\n      [\"Other / untagged\", 16900, 0.6, 0.8, 0.7],\n      [\"Islam\", 12400, 0.55, 0.85, 0.75],\n      [\"Anglican\", 9200, 1.5, 1.15, 0.4],\n      [\"Buddhist\", 7800, 0.8, 0.9, 0.7],\n    ]},\n    housing: { label: \"Housing\", segs: [\n      [\"Renters\", 54300, 0.6, 0.8, 0.85],\n      [\"Homeowners\", 48600, 1.5, 1.2, 0.55],\n      [\"No housing tag\", 17500, 0.62, 0.75, 0.7],\n    ]},\n  };\n\n  hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }\n  jit(s, lo, hi) { const x = Math.abs(Math.sin(this.hash(s)) * 10000) % 1; return lo + x * (hi - lo); }\n  clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }\n  fmt(n) { return Math.round(n).toLocaleString(\"en-AU\"); }\n\n  cutUnder() { return this.props.underservedCutoff ?? 0.8; }\n  cutOver() { return this.props.overservedCutoff ?? 1.25; }\n\n  colorFor(R) {\n    const u = this.cutUnder(), o = this.cutOver();\n    if (R < 0.5) return { bg: \"#E85D2F\", fg: \"#FFFFFF\", chip: \"#9A3413\" };\n    if (R < 0.65) return { bg: \"#F08B5B\", fg: \"#4A1C08\", chip: \"#8A3A1B\" };\n    if (R < u) return { bg: \"#F8C9AC\", fg: \"#6E2E11\", chip: \"#8A3A1B\" };\n    if (R <= Math.max(1.1, u + 0.01)) return { bg: \"#EDF0F5\", fg: \"#3E4C61\", chip: \"#64748B\" };\n    if (R <= o) return { bg: \"#C9DAF8\", fg: \"#1A4AA0\", chip: \"#1A4AA0\" };\n    if (R <= 1.55) return { bg: \"#7FA4EC\", fg: \"#0E2C63\", chip: \"#17499E\" };\n    return { bg: \"#2E6FE0\", fg: \"#FFFFFF\", chip: \"#123C86\" };\n  }\n  statusFor(R) { return R < this.cutUnder() ? \"Underserved\" : R > this.cutOver() ? \"Overserved\" : \"Balanced\"; }\n  statusChip(status) {\n    if (status === \"Underserved\") return { bg: \"#FFF1EA\", fg: \"#C24E15\" };\n    if (status === \"Overserved\") return { bg: \"#EDF3FD\", fg: \"#1A4AA0\" };\n    return { bg: \"#E9F5EF\", fg: \"#1F7549\" };\n  }\n\n  metricsFor(dimKey, periodIdx) {\n    const p = this.PERIODS[periodIdx];\n    const segs = this.DIMS[dimKey].segs;\n    const totalPop = segs.reduce((s, x) => s + x[1], 0);\n    const raw = segs.map(([name, pop, bias, eng, dig]) => {\n      const cr = this.clamp(p.base * bias * this.jit(name + p.short, 0.92, 1.08), 0.004, 0.93);\n      return { name, pop, bias, eng, dig, cr, contacts: pop * cr };\n    });\n    const totC = raw.reduce((s, x) => s + x.contacts, 0);\n    return raw.map((x) => {\n      const popShare = x.pop / totalPop;\n      const commsShare = x.contacts / totC;\n      const R = commsShare / popShare;\n      const opens = this.clamp((0.4 + 0.02 * periodIdx) * x.eng * this.jit(x.name + \"o\" + p.short, 0.93, 1.07), 0.05, 0.82);\n      const resp = this.clamp((0.05 + 0.005 * periodIdx) * x.eng * this.jit(x.name + \"r\", 0.9, 1.1), 0.01, 0.4);\n      const engNorm = this.clamp((x.eng - 0.55) / 0.75, 0, 1);\n      const score = Math.round(100 * this.clamp(0.62 * Math.min(R, 1.3) / 1.3 + 0.38 * engNorm, 0, 1));\n      return { ...x, popShare, commsShare, R, opens, resp, score, status: this.statusFor(R), dimKey, dimLabel: this.DIMS[dimKey].label };\n    });\n  }\n\n  electorateScore(periodIdx) {\n    const dims = Object.keys(this.DIMS);\n    let acc = 0;\n    for (const d of dims) {\n      const m = this.metricsFor(d, periodIdx);\n      const tp = m.reduce((s, x) => s + x.pop, 0);\n      const dev = m.reduce((s, x) => s + Math.min(Math.abs(x.R - 1), 1.2) * x.pop, 0) / tp;\n      acc += Math.max(0, 1 - dev * 1.15);\n    }\n    return Math.round((100 * acc) / dims.length);\n  }\n\n  worstRatio(row, side) {\n    const sum = row.reduce((s, d) => s + d.a, 0);\n    let worst = 0;\n    for (const d of row) {\n      const r = Math.max((side * side * d.a) / (sum * sum), (sum * sum) / (side * side * d.a));\n      if (r > worst) worst = r;\n    }\n    return worst;\n  }\n\n  squarify(items, W, H) {\n    const total = items.reduce((s, d) => s + d.v, 0);\n    let scaled = items.map((d) => ({ ...d, a: (d.v * W * H) / total }));\n    const rects = [];\n    let x = 0, y = 0, w = W, h = H;\n    while (scaled.length) {\n      let row = [scaled[0]];\n      let best = this.worstRatio(row, Math.min(w, h));\n      let i = 1;\n      while (i < scaled.length) {\n        const cand = row.concat(scaled[i]);\n        const wr = this.worstRatio(cand, Math.min(w, h));\n        if (wr <= best) { row = cand; best = wr; i++; } else break;\n      }\n      const sum = row.reduce((s, d) => s + d.a, 0);\n      if (w >= h) {\n        const rw = sum / h; let ry = y;\n        for (const d of row) { const rh = d.a / rw; rects.push({ ...d, x, y: ry, w: rw, h: rh }); ry += rh; }\n        x += rw; w -= rw;\n      } else {\n        const rh = sum / w; let rx = x;\n        for (const d of row) { const dw = d.a / rh; rects.push({ ...d, x: rx, y, w: dw, h: rh }); rx += dw; }\n        y += rh; h -= rh;\n      }\n      scaled = scaled.slice(row.length);\n    }\n    return rects;\n  }\n\n  cellR(r, c) {\n    return this.clamp(r.R * c.R * this.jit(r.name + \"|\" + c.name, 0.88, 1.12), 0.08, 2.4);\n  }\n\n  segDetailBase(m, periodIdx) {\n    const enrolled = m.pop;\n    const reachable = enrolled * Math.min(0.95, 0.6 + 0.32 * m.dig);\n    const contacted = Math.min(enrolled * m.cr, reachable * 0.97);\n    const opened = contacted * m.opens;\n    const responded = contacted * m.resp;\n    const email = Math.round(28 + 46 * m.dig);\n    const sms = Math.round(4 + 20 * m.dig);\n    const calls = Math.max(3, Math.round(20 - 12 * m.dig));\n    const letters = Math.max(0, 100 - email - sms - calls);\n    const lastDays = this.clamp(Math.round(10 / m.bias), 2, 140);\n    return { enrolled, reachable, contacted, opened, responded, email, sms, calls, letters, lastDays };\n  }\n\n  componentDidMount() {\n    this._move = (e) => { if (this._drag) this.setPeriodFromX(e.clientX); };\n    this._up = () => { this._drag = false; };\n    window.addEventListener(\"pointermove\", this._move);\n    window.addEventListener(\"pointerup\", this._up);\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"pointermove\", this._move);\n    window.removeEventListener(\"pointerup\", this._up);\n  }\n  setPeriodFromX(clientX) {\n    const el = this.trackRef.current;\n    if (!el) return;\n    const r = el.getBoundingClientRect();\n    const t = this.clamp((clientX - r.left) / r.width, 0, 1);\n    const idx = Math.round(t * 4);\n    if (idx !== this.state.period) this.setState({ period: idx });\n  }\n  onTrackDown = (e) => { this._drag = true; this.setPeriodFromX(e.clientX); };\n  onRowDim = (e) => {\n    const v = e.target.value;\n    this.setState(v === this.state.colDim ? { rowDim: v, colDim: this.state.rowDim } : { rowDim: v });\n  };\n  onColDim = (e) => {\n    const v = e.target.value;\n    this.setState(v === this.state.rowDim ? { colDim: v, rowDim: this.state.colDim } : { colDim: v });\n  };\n\n  renderVals() {\n    const period = this.state.period;\n    const P = this.PERIODS[period];\n    const dimKey = this.state.dim;\n    const fmt = (n) => this.fmt(n);\n\n    // ---- period slider ----\n    const stops = this.PERIODS.map((p, i) => ({\n      label: p.label.replace(\"Last \", \"\").replace(\"week\", \"1 week\").replace(\"month\", \"1 month\").replace(\"3 1 months\", \"3 months\"),\n      left: (i / 4) * 100,\n      dotBg: i <= period ? \"#2E6FE0\" : \"#FFFFFF\",\n      dotBorder: i <= period ? \"#2E6FE0\" : \"#CBD5E1\",\n      weight: i === period ? 700 : 500,\n      color: i === period ? \"#1A4AA0\" : \"#94A3B8\",\n      onClick: () => this.setState({ period: i }),\n    }));\n    stops[0].label = \"1 week\"; stops[1].label = \"1 month\"; stops[2].label = \"3 months\"; stops[3].label = \"6 months\"; stops[4].label = \"1 year\";\n\n    // ---- header ----\n    let underCount = 0, overCount = 0, balancedCount = 0;\n    const pooled = [];\n    for (const d of Object.keys(this.DIMS)) {\n      for (const m of this.metricsFor(d, period)) {\n        pooled.push(m);\n        if (m.status === \"Underserved\") underCount++;\n        else if (m.status === \"Overserved\") overCount++;\n        else balancedCount++;\n      }\n    }\n    const electorateScore = this.electorateScore(period);\n    const prevScore = period > 0 ? this.electorateScore(period - 1) : null;\n    const delta = prevScore == null ? null : electorateScore - prevScore;\n    const scoreDeltaText = delta == null ? \"\\u2014\" : delta === 0 ? \"\\u00b1 0\" : (delta > 0 ? \"\\u25b2 +\" : \"\\u25bc \\u2212\") + Math.abs(delta);\n    const scoreColor = electorateScore >= 70 ? \"#1F7549\" : electorateScore >= 45 ? \"#B87407\" : \"#C24E15\";\n\n    const suburbM = this.metricsFor(\"suburb\", period);\n    const contactedN = suburbM.reduce((s, x) => s + x.contacts, 0);\n    const sendsN = contactedN * 2.3;\n\n    // ---- treemap ----\n    const metrics = this.metricsFor(dimKey, period);\n    const sorted = [...metrics].sort((a, b) => b.pop - a.pop);\n    const rects = this.squarify(sorted.map((m) => ({ v: m.pop, m })), 190, 100);\n    const sel = this.state.sel;\n    const isSel = (d, n) => sel && sel.kind === \"seg\" && sel.dim === d && sel.name === n;\n    const tiles = rects.map((r) => {\n      const m = r.m;\n      const col = this.colorFor(m.R);\n      const wPct = (r.w / 190) * 100, hPct = r.h;\n      return {\n        name: m.name,\n        popLabel: fmt(m.pop) + \" electors\",\n        l: (r.x / 190) * 100, t: r.y, w: wPct, h: hPct,\n        bg: col.bg, fg: col.fg, chipFg: col.chip,\n        big: wPct >= 16 && hPct >= 22,\n        line1: Math.round(m.cr * 100) + \"% contacted \\u00b7 \" + Math.round(m.opens * 100) + \"% opens\",\n        line2: Math.round(m.resp * 100) + \"% responded\",\n        status: m.status,\n        ring: isSel(dimKey, m.name) ? \"0 0 0 2.5px #0D1319\" : \"none\",\n        onClick: () => this.setState({ sel: { kind: \"seg\", dim: dimKey, name: m.name } }),\n      };\n    });\n\n    const dimTabs = Object.keys(this.DIMS).map((k) => ({\n      label: this.DIMS[k].label,\n      bg: k === dimKey ? \"#FFFFFF\" : \"transparent\",\n      color: k === dimKey ? \"#0D1319\" : \"#64748B\",\n      shadow: k === dimKey ? \"0 1px 3px rgba(14,17,22,0.12)\" : \"none\",\n      onClick: () => this.setState({ dim: k, sel: null }),\n    }));\n\n    // ---- detail ----\n    let detail;\n    if (sel && sel.kind === \"cell\") {\n      const rm = this.metricsFor(sel.rowDim, period).find((x) => x.name === sel.rowName);\n      const cm = this.metricsFor(sel.colDim, period).find((x) => x.name === sel.colName);\n      if (rm && cm) {\n        const R = this.cellR(rm, cm);\n        const pop = Math.max(300, Math.round(rm.popShare * cm.popShare * this.TOTAL));\n        const pseudo = {\n          name: rm.name + \" \\u00d7 \" + cm.name, pop,\n          bias: this.clamp(rm.bias * cm.bias, 0.1, 3),\n          eng: (rm.eng + cm.eng) / 2, dig: (rm.dig + cm.dig) / 2,\n          cr: this.clamp(P.base * rm.bias * cm.bias, 0.003, 0.93),\n          opens: (rm.opens + cm.opens) / 2, resp: (rm.resp + cm.resp) / 2,\n          R, popShare: rm.popShare * cm.popShare, commsShare: null,\n          score: Math.round(100 * this.clamp(0.62 * Math.min(R, 1.3) / 1.3 + 0.38 * this.clamp(((rm.eng + cm.eng) / 2 - 0.55) / 0.75, 0, 1), 0, 1)),\n          status: this.statusFor(R),\n        };\n        detail = this.buildDetail(pseudo, \"Intersection \\u00b7 \\u2248\" + fmt(pop) + \" enrolled (est.)\", period);\n      }\n    }\n    if (!detail) {\n      let m = sel && sel.kind === \"seg\" ? this.metricsFor(sel.dim, period).find((x) => x.name === sel.name) : null;\n      if (!m) m = [...metrics].sort((a, b) => a.R - b.R)[0];\n      detail = this.buildDetail(m, m.dimLabel + \" \\u00b7 \" + fmt(m.pop) + \" enrolled (\" + (m.popShare * 100).toFixed(1) + \"% of electorate)\", period);\n    }\n\n    // ---- ranked ----\n    const byR = [...pooled].sort((a, b) => a.R - b.R);\n    const rankedRaw = [...byR.slice(0, 6), ...byR.slice(-6)].sort((a, b) => a.R - b.R);\n    const ranked = rankedRaw.map((m) => {\n      const under = m.R < 1;\n      const w = Math.min(Math.abs(m.R - 1), 1) * 50;\n      const selMatch = isSel(m.dimKey, m.name);\n      return {\n        name: m.name, dim: m.dimLabel,\n        left: under ? 50 - w : 50, w: Math.max(w, 1),\n        color: under ? \"#ED6A2F\" : \"#2E6FE0\",\n        val: m.R.toFixed(1) + \"\\u00d7\",\n        valColor: under ? \"#C24E15\" : \"#1A4AA0\",\n        rowBg: selMatch ? \"#F4F6F9\" : \"transparent\",\n        onClick: () => this.setState({ dim: m.dimKey, sel: { kind: \"seg\", dim: m.dimKey, name: m.name } }),\n      };\n    });\n\n    // ---- heatmap ----\n    const rowDim = this.state.rowDim, colDim = this.state.colDim;\n    const rowM = this.metricsFor(rowDim, period);\n    const colM = this.metricsFor(colDim, period);\n    const gridCols = \"150px repeat(\" + colM.length + \", minmax(0,1fr))\";\n    const heatColLabels = colM.map((c) => c.name);\n    const heatRows = rowM.map((r) => ({\n      label: r.name,\n      cells: colM.map((c) => {\n        const R = this.cellR(r, c);\n        const col = this.colorFor(R);\n        const selCell = sel && sel.kind === \"cell\" && sel.rowName === r.name && sel.colName === c.name;\n        return {\n          bg: col.bg, fg: col.fg,\n          label: R.toFixed(1),\n          title: r.name + \" \\u00d7 \" + c.name + \" \\u2014 \" + R.toFixed(1) + \"\\u00d7 fair share\",\n          ring: selCell ? \"0 0 0 2px #0D1319\" : \"none\",\n          onClick: () => this.setState({ sel: { kind: \"cell\", rowDim, rowName: r.name, colDim, colName: c.name } }),\n        };\n      }),\n    }));\n\n    // ---- actions ----\n    const usedDims = new Set();\n    const picks = [];\n    for (const m of byR) {\n      if (usedDims.has(m.dimKey)) continue;\n      usedDims.add(m.dimKey);\n      picks.push(m);\n      if (picks.length === 3) break;\n    }\n    const actions = picks.map((m) => {\n      const b = this.segDetailBase(m, period);\n      let kind, cta;\n      if (m.dig >= 0.7) { kind = \"campaign\"; cta = \"Run a campaign\"; }\n      else if (m.dig < 0.45) { kind = \"letter\"; cta = \"Draft a letter drop\"; }\n      else { kind = \"followup\"; cta = \"Schedule follow-ups\"; }\n      return {\n        kicker: \"Underserved \\u00b7 \" + m.dimLabel,\n        title: m.name + \": \" + m.R.toFixed(1) + \"\\u00d7 fair share of attention\",\n        body: fmt(m.pop) + \" enrolled \\u00b7 \" + Math.round(m.cr * 100) + \"% contacted in the \" + P.label.toLowerCase().replace(\"last \", \"last \") + \" \\u00b7 last targeted send \" + b.lastDays + \" days ago. Moving them T2 \\u2192 T3 starts here.\",\n        cta,\n        isCampaign: kind === \"campaign\", isLetter: kind === \"letter\", isFollowup: kind === \"followup\",\n        onClick: () => this.setState({ dim: m.dimKey, sel: { kind: \"seg\", dim: m.dimKey, name: m.name } }),\n      };\n    });\n\n    return {\n      showSidebar: this.props.showSidebar ?? true,\n      periodKicker: P.kicker,\n      periodLabel: P.label,\n      thumbPct: (period / 4) * 100,\n      stops,\n      trackRef: this.trackRef,\n      onTrackDown: this.onTrackDown,\n      underCount, overCount, balancedCount,\n      electorateScore, scoreDeltaText, scoreColor,\n      sendsTotal: fmt(Math.round(sendsN / 100) * 100),\n      contactedTotal: fmt(contactedN),\n      dimTabs, tiles,\n      detail,\n      ranked,\n      rowDim, colDim, onRowDim: this.onRowDim, onColDim: this.onColDim,\n      gridCols, heatColLabels, heatRows,\n      actions,\n    };\n  }\n\n  buildDetail(m, subtitle, period) {\n    const b = this.segDetailBase(m, period);\n    const chip = this.statusChip(m.status);\n    const funnel = [\n      { label: \"Enrolled\", tier: \"T1\", color: \"#9AA4B2\", chipBg: \"#EEF1F5\", chipFg: \"#475569\", v: b.enrolled },\n      { label: \"Reachable\", tier: \"T2\", color: \"#5B7BAB\", chipBg: \"#E7EDF7\", chipFg: \"#3D5780\", v: b.reachable },\n      { label: \"Contacted\", tier: \"T3\", color: \"#2E6FE0\", chipBg: \"#E5EEFC\", chipFg: \"#1A4AA0\", v: b.contacted },\n      { label: \"Opened\", tier: \"\", color: \"#6C97E8\", chipBg: \"\", chipFg: \"\", v: b.opened },\n      { label: \"Responded\", tier: \"T4\", color: \"#7E5BD0\", chipBg: \"#EDE6F8\", chipFg: \"#4F3899\", v: b.responded },\n    ].map((f) => ({\n      ...f,\n      value: this.fmt(f.v),\n      pct: Math.max((f.v / b.enrolled) * 100, 1.5),\n      pctLabel: Math.round((f.v / b.enrolled) * 100) + \"%\",\n    }));\n    const mix = [\n      { label: \"Email\", pct: b.email, color: \"#2E6FE0\" },\n      { label: \"SMS\", pct: b.sms, color: \"#2A9560\" },\n      { label: \"Letters\", pct: b.letters, color: \"#EC9308\" },\n      { label: \"Calls\", pct: b.calls, color: \"#94A3B8\" },\n    ];\n    const cta = m.status === \"Underserved\" ? \"Run a catch-up campaign\" : m.status === \"Overserved\" ? \"Rebalance future sends\" : \"Keep the rhythm \\u2014 follow up\";\n    const shareLine = m.commsShare != null\n      ? (m.commsShare * 100).toFixed(1) + \"% of sends \\u00b7 \" + (m.popShare * 100).toFixed(1) + \"% of electorate\"\n      : \"\\u2248\" + (m.popShare * 100).toFixed(1) + \"% of electorate \\u00b7 estimated from tag overlap\";\n    return {\n      title: m.name,\n      subtitle,\n      status: m.status, chipBg: chip.bg, chipFg: chip.fg,\n      score: m.score,\n      scoreColor: m.score >= 70 ? \"#1F7549\" : m.score >= 40 ? \"#B87407\" : \"#C24E15\",\n      ratio: m.R.toFixed(1) + \"\\u00d7 fair share\",\n      ratioColor: m.R < this.cutUnder() ? \"#C24E15\" : m.R > this.cutOver() ? \"#1A4AA0\" : \"#1F7549\",\n      shareLine,\n      funnel, mix,\n      lastDays: b.lastDays,\n      cta,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
