<style>
@font-face{font-family:'Public Sans';font-weight:400;font-display:swap;src:url(fonts/public-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Public Sans';font-weight:500;font-display:swap;src:url(fonts/public-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Public Sans';font-weight:600;font-display:swap;src:url(fonts/public-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Public Sans';font-weight:700;font-display:swap;src:url(fonts/public-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Public Sans';font-weight:800;font-display:swap;src:url(fonts/public-sans-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}

:root{
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#0D1319; --ink2:#475569; --muted:#64748B; --faint:#94A3B8;
  --line:#E3E7EE; --line2:#EFF2F6; --chip:#EEF1F5;
  --blue:#2E6FE0; --blue-d:#1A4AA0; --blue-l:#EDF3FD; --blue-ll:#DBE7FA;
  --green:#1F7549; --green-m:#2A9560; --green-l:#E9F5EF;
  --orange:#C24E15; --orange-m:#E85D2F; --orange-l:#FFF1EA;
  --amber:#B87407; --amber-m:#EC9308; --amber-l:#FDF4E3;
  --purple:#7E5BD0;
  --u3:#E85D2F; --u2:#F08B5B; --u1:#F8C9AC; --bal:#EEF1F5; --o1:#DBE7FA; --o2:#8FB1EE; --o3:#2E6FE0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:#1E58C0;text-decoration:none} a:hover{text-decoration:underline}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.brand img{width:36px;height:36px;border-radius:9px}
.brand b{display:block;font-size:16px}.brand span{font-size:12px;color:var(--blue);font-weight:600}
.office{margin:14px 12px 4px;padding:10px;border-radius:10px;display:flex;gap:10px;align-items:center}
.office .av{width:30px;height:30px;border-radius:7px;background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;font-size:11px;font-weight:700}
.office b{display:block;font-size:13px}.office span{font-size:11.5px;color:var(--muted)}
.nav-h{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:16px 24px 6px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:12px;margin:2px 12px;padding:9px 12px;border-radius:9px;color:var(--ink2);cursor:pointer;border:0;background:none;width:calc(100% - 24px);text-align:left;font-size:14px}
.nav:hover{background:var(--line2)} .nav.on{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.nav[disabled]{opacity:.5;cursor:default} .nav[disabled]:hover{background:none}
.nav .r{margin-left:auto;font-size:11px;color:var(--faint)}
.badge{margin-left:auto;background:var(--orange-m);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:1px 7px}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;padding:14px}
.privacy{background:var(--line2);border-radius:10px;padding:12px;font-size:12px;color:var(--ink2);display:flex;gap:9px}
.privacy svg{flex:none;color:var(--green-m);width:16px;height:16px;margin-top:1px}
.trialtag{margin-top:10px;font-size:11.5px;color:var(--muted);padding:0 4px}

/* main */
.main{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.blue{background:var(--blue-l);color:var(--blue-d)} .chip.grey{background:var(--chip);color:var(--ink2)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.topbar .meta{color:var(--ink2);font-size:13px}
.topbar .ok{margin-left:auto;color:var(--green);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.btn:hover{border-color:#CBD3DF} .btn svg{width:15px;height:15px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff} .btn.primary:hover{background:var(--blue-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;justify-content:center;padding:10px}
.wrap{padding:24px 32px 48px;max-width:1440px;margin:0 auto}
.kicker{font-size:11.5px;letter-spacing:.12em;font-weight:600;color:var(--muted);text-transform:uppercase}
h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.015em;line-height:1.15}
.lede{color:var(--ink2);font-size:15px;max-width:680px;margin:0}
.hero{display:flex;gap:32px;align-items:flex-end;justify-content:space-between;flex-wrap:nowrap}.hero>div:first-child{flex:1;min-width:0}.hero .stats{flex:none}
.stats{display:flex;gap:28px;align-items:flex-end}
.stat{text-align:right}
.stat .k{font-size:11px;letter-spacing:.1em;font-weight:600;color:var(--muted);text-transform:uppercase}
.stat .v{font-size:30px;font-weight:700;line-height:1.1}
.stat .v small{font-size:14px;color:var(--faint);font-weight:500}
.stat .s{font-size:12px;color:var(--muted)}
.stat.big .v{font-size:42px;color:var(--green)}
.vsep{width:1px;align-self:stretch;background:var(--line)}
.pills{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.pill.u{background:var(--orange-l);color:var(--orange)} .pill.u i{background:var(--orange-m)}
.pill.o{background:var(--blue-l);color:var(--blue-d)} .pill.o i{background:var(--blue)}
.pill.b{background:var(--green-l);color:var(--green)} .pill.b i{background:var(--green-m)}
.pill.l{background:var(--amber-l);color:var(--amber)} .pill.l i{background:var(--amber-m)}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.03)}
.card h2{font-size:18px;margin:2px 0 2px} .card .sub{color:var(--muted);font-size:13px}
.period{margin-top:18px;display:grid;grid-template-columns:150px 1fr auto auto auto;gap:28px;align-items:center}
.period .lbl b{display:block;font-size:17px}
.slider{position:relative;padding:20px 32px 30px}
.slider .track{height:4px;background:var(--line);border-radius:2px;position:relative}
.slider .fill{position:absolute;left:0;top:0;height:4px;background:var(--blue);border-radius:2px}
.stops{position:absolute;left:32px;right:32px;top:22px;height:0}
.stop{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;cursor:pointer;font-size:11.5px;color:var(--faint);width:72px;padding:14px 0 0;text-align:center;white-space:nowrap}
.stop .dot{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #CBD3DF;box-sizing:border-box}
.stop.past .dot{background:var(--blue);border-color:var(--blue)}
.stop.on{color:var(--blue-d);font-weight:700} .stop.on .dot{width:20px;height:20px;border:3px solid var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(46,111,224,.12)}
.slider.off{opacity:.45;pointer-events:none}
.mini{text-align:right} .mini .k{font-size:11px;letter-spacing:.1em;font-weight:600;color:var(--muted)} .mini b{font-size:20px;display:block} .mini span{font-size:12px;color:var(--ink2)}
.split{height:6px;border-radius:3px;display:flex;overflow:hidden;width:170px;margin:6px 0 4px;background:var(--line)}
.split i{display:block;height:100%}
.splitlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);width:170px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:18px}
.grid2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cardhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
.note{font-size:12px;color:var(--muted)}

.tm{position:relative;height:520px;border-radius:8px;overflow:hidden}
.tile{position:absolute;border:2px solid #fff;border-radius:7px;padding:8px 10px;overflow:hidden;cursor:pointer;color:var(--ink);text-align:left;font-size:12px;line-height:1.35}
.tile b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .e{opacity:.75}
.tile .d{margin-top:6px;opacity:.85}
.tile .st{display:inline-block;margin-top:7px;background:#fff;border-radius:999px;padding:1px 8px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}
.tile.sel{outline:3px solid var(--ink);outline-offset:-3px;z-index:2}
.tile.dark{color:#fff}
.tile .lr{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--amber-m);box-shadow:0 0 0 2px #fff}
.legend{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:12px;flex-wrap:wrap}
.legend .sw{display:inline-flex;gap:2px}
.legend .sw i{width:11px;height:11px;border-radius:2px;display:inline-block}

.seg .status{font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:2px 8px;text-transform:uppercase}
.st-u{background:var(--orange-l);color:var(--orange)} .st-o{background:var(--blue-l);color:var(--blue-d)} .st-b{background:var(--green-l);color:var(--green)} .st-n{background:var(--chip);color:var(--muted)}
.scorebox{background:var(--line2);border-radius:10px;padding:12px 16px;display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.scorebox .n{font-size:30px;font-weight:700}
.scorebox .fs{margin-left:auto;font-weight:700}
.reachline{border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;margin:10px 0;display:flex;gap:8px;align-items:center}
.reachline.low{background:var(--orange-l);color:var(--orange)} .reachline.ok{background:var(--green-l);color:var(--green)}
.reachline i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.sec{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--ink2);margin:16px 0 8px;text-transform:uppercase}
.fun{margin-bottom:9px} .fun .r{display:flex;justify-content:space-between;font-size:13px}
.fun .r b{font-weight:700} .fun .r span{color:var(--faint);font-size:11.5px;margin-left:8px}
.bar{height:6px;background:var(--line2);border-radius:3px;margin-top:4px;overflow:hidden} .bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line2)} .mix i{display:block;height:100%}
.mixl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2);margin-top:6px}
.mixl span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px}

.gap .row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.gap .row:hover{background:var(--line2)}
.gap .nm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .gap .nm span{font-size:11px;color:var(--faint)}
.gap .axis{position:relative;height:12px}
.gap .axis::before{content:'';position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:var(--line)}
.gap .axis i{position:absolute;top:2px;height:8px;border-radius:4px}
.gap .v{text-align:right;font-weight:700;font-size:12.5px}
.gaphead{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;font-size:11px;color:var(--faint);margin-top:10px}
.gaphead div:nth-child(2){display:flex;justify-content:space-between;padding:0 18%}

.hm table{border-collapse:separate;border-spacing:3px;width:100%;font-size:11.5px}
.hm th{font-weight:500;color:var(--muted);text-align:center;padding:2px}
.hm th.rh{text-align:left;color:var(--ink2);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.hm td{text-align:center;border-radius:4px;padding:6px 2px;font-weight:600;font-size:11.5px}
.hm td.blank{background:repeating-linear-gradient(45deg,#F4F6F9,#F4F6F9 4px,#fff 4px,#fff 8px);color:transparent}
.hm select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;margin-right:6px}

.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px}
.move .tag{font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--orange);text-transform:uppercase;display:flex;gap:10px;align-items:center}
.move .tag .ic{width:30px;height:30px;border-radius:8px;background:var(--orange-l);display:grid;place-items:center}
.move .tag .ic svg{width:16px;height:16px}
.move h3{font-size:16px;margin:14px 0 6px;line-height:1.35}
.move p{color:var(--ink2);font-size:13px;margin:0 0 14px}
.move .acts{display:flex;gap:8px} .move .acts .btn.primary{flex:1;justify-content:center}

.trend{margin-top:18px}
.tchart{display:flex;gap:10px;align-items:stretch;height:190px;margin-top:14px}.tcol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;text-align:center}.tv{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-bottom:4px}.tbar{background:#C9B8F0;border-radius:4px 4px 2px 2px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;min-height:2px;max-height:140px}.tbar i{display:block;background:var(--blue)}.tl{font-size:12px;color:var(--muted);margin-top:6px}.tcol.partial .tbar{opacity:.55}.tcol:hover .tbar{filter:brightness(.95)}

/* empty / import */
.empty{max-width:880px;margin:36px auto}
.drop{border:2px dashed #CBD3DF;border-radius:14px;padding:34px;text-align:center;background:#fff;transition:.15s}
.drop.over{border-color:var(--blue);background:var(--blue-l)}
.drop h2{margin:6px 0}
.drop p{color:var(--ink2);margin:6px 0 16px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.opt{text-align:left;cursor:pointer}
.opt h3{font-size:14.5px;margin:0 0 4px} .opt p{font-size:12.5px;color:var(--ink2);margin:0}
.opt:hover{border-color:var(--blue)}
.how{margin-top:22px}
.how ol{padding-left:20px;color:var(--ink2);margin:8px 0 0} .how li{margin:4px 0}

.modal-bg{position:fixed;inset:0;background:rgba(13,19,25,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header .kicker{font-size:11px}
.modal header h2{margin:2px 0 0;font-size:19px}
.modal .body{padding:18px 22px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--line2);border-radius:0 0 16px 16px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.gate{display:grid;gap:10px}
.g{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:24px 1fr;gap:8px}
.g .i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.g.ok .i{background:var(--green-m)} .g.warn .i{background:var(--amber-m)} .g.bad .i{background:var(--orange-m)} .g.info .i{background:var(--faint)}
.g.bad{border-color:#F8C9AC;background:var(--orange-l)}
.g b{display:block;font-size:13.5px} .g span{font-size:12.5px;color:var(--ink2)}
.cols{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px} .cols code{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--line2);border-radius:5px;padding:1px 6px}
.cols code.s{text-decoration:line-through;color:var(--orange)}
.uq{display:grid;grid-template-columns:1fr 200px 150px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.uq b{font-size:13px} .uq span{font-size:11.5px;color:var(--muted);display:block}
.uq select,.uq input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;width:100%;background:#fff;font-size:12.5px}
.prog{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:10px} .prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.hidden{display:none!important}
table.plain{width:100%;border-collapse:collapse;font-size:13px} table.plain td,table.plain th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line2)} table.plain th{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

@media (max-width:1180px){.grid2{grid-template-columns:1fr}.grid2b{grid-template-columns:1fr}.moves{grid-template-columns:1fr}.period{grid-template-columns:1fr;gap:12px}.mini{text-align:left}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.side .navs,.side-foot{display:none}.wrap{padding:18px 16px}.topbar{padding:10px 16px}.opts{grid-template-columns:1fr}.stats{flex-wrap:wrap;gap:16px}.stat{text-align:left}.uq{grid-template-columns:1fr}.tm{height:520px}}
.help{border:0;background:none;color:var(--blue-d);font-size:12px;font-weight:600;cursor:pointer;padding:0;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.help svg{width:13px;height:13px} .help:hover{text-decoration:underline}
.banner{background:var(--amber-l);border:1px solid #F3D9A6;color:#6B4605;border-radius:12px;padding:11px 15px;font-size:13px;margin-bottom:18px}
.field{border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;font:inherit}
.ack{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--line2);cursor:pointer;font-size:13.5px}
.ack input{margin-top:3px;width:16px;height:16px;flex:none}
.ticks{margin:0;padding-left:18px;color:var(--ink2);font-size:13.5px} .ticks li{margin:4px 0}
.guide{max-width:900px;margin:28px auto} .guide h1{margin:4px 0 6px} .guide>h2{font-size:19px;margin:34px 0 6px} .guide h3{font-size:15px;margin:22px 0 6px}
.guide>p{color:var(--ink2);font-size:14px;max-width:720px}
.steps{padding:6px 20px;margin-top:20px}
